[project]
name = "omniforge"
version = "0.1.0"
description = "OmniForge AI — Multimodal Personal Research, Coding & Creation Agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "OmniForge Developer"}]
dependencies = [
    "aiosqlite>=0.22.1",
    "arxiv>=4.0.1",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langmem>=0.0.30",
    "langsmith>=0.14.1",
    "mcp[cli]>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "tenacity>=9.1.4",
    "trafilatura>=2.2.0",
]

[project.scripts]
omniforge = "omniforge:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
